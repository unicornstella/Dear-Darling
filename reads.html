
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reads | Dear, Darling</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .reading-library {
      max-width: 1000px;
      margin: 35px auto;
      padding: 25px;
      color: #40533b;
    }

    .library-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .library-heading h1 {
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .book-form {
      background: #f3edde;
      border: 1px solid #d8cbb5;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 35px;
    }

    .book-form input,
    .book-form textarea,
    .book-form select {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin: 9px 0 16px;
      border: 1px solid #c9b99e;
      border-radius: 7px;
      background: #fffdf7;
      color: #40533b;
      font: inherit;
    }

    .book-form label {
      font-weight: bold;
      font-size: 14px;
    }

    .library-button {
      background: #526747;
      color: white;
      border: none;
      padding: 12px 19px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }

    .library-button:hover {
      background: #394d32;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 25px;
    }

    .book-card {
      cursor: pointer;
      text-align: center;
      padding: 12px;
      background: #eee4d3;
      border-radius: 10px;
      border: 1px solid #d8cbb5;
      transition: transform 0.2s;
    }

    .book-card:hover {
      transform: translateY(-5px);
    }

    .book-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 5px;
      box-shadow: 3px 4px 8px #0002;
    }

    .book-card h3 {
      font-family: Georgia, serif;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .book-card p {
      font-size: 13px;
      margin-top: 4px;
    }

    .empty-library {
      text-align: center;
      padding: 35px;
      color: #786d5b;
      font-family: Georgia, serif;
    }

    .book-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #172016cc;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: #f6f0e4;
      color: #40533b;
      max-width: 550px;
      margin: 45px auto;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      position: relative;
    }

    .modal-content img {
      width: 170px;
      max-width: 100%;
      border-radius: 6px;
      box-shadow: 3px 5px 10px #0002;
    }

    .modal-content h2 {
      font-family: Georgia, serif;
    }

    .modal-review {
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.7;
      background: #fffdf7;
      padding: 15px;
      border-radius: 8px;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      border: none;
      background: none;
      color: #40533b;
      font-size: 26px;
      cursor: pointer;
    }

    .delete-button {
      background: #8b5148;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>dear, darling ♡</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="gossip.html">Gossip</a>
  <a href="reads.html">Reads</a>
  <a href="marvel.html">Marvel</a>
  <a href="music.html">Music</a>
  <a href="youtube.html">YouTube</a>
</nav>

<main class="reading-library">

  <section class="library-heading">
    <h1>୨ৎ My Reading Library ୨ৎ</h1>
    <p>A little home for all the stories I've read.</p>
  </section>

  <section class="book-form">
    <h2>Add a new book ♡</h2>

    <form id="book-form">
      <label for="title">Book title</label>
      <input id="title" type="text" placeholder="Enter the book title" required>

      <label for="author">Author</label>
      <input id="author" type="text" placeholder="Enter the author's name" required>

      <label for="cover">Book cover image URL (optional)</label>
      <input id="cover" type="url" placeholder="Paste an image link">

      <label for="rating">Your rating</label>
      <select id="rating">
        <option value="★★★★★">★★★★★</option>
        <option value="★★★★☆">★★★★☆</option>
        <option value="★★★☆☆">★★★☆☆</option>
        <option value="★★☆☆☆">★★☆☆☆</option>
        <option value="★☆☆☆☆">★☆☆☆☆</option>
      </select>

      <label for="date">Date finished</label>
      <input id="date" type="date">

      <label for="review">Your review</label>
      <textarea id="review" rows="5" placeholder="Write your thoughts about this book..."></textarea>

      <button class="library-button" type="submit">Add to my bookshelf ♡</button>
    </form>
  </section>

  <section>
    <h2>My Bookshelf</h2>
    <div id="bookshelf" class="bookshelf"></div>
  </section>

</main>

<div id="book-modal" class="book-modal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeBook()">×</button>
    <img id="modal-cover" src="" alt="Book cover">
    <h2 id="modal-title"></h2>
    <p id="modal-author"></p>
    <p id="modal-rating"></p>
    <p id="modal-date"></p>
    <h3>My Review ♡</h3>
    <div id="modal-review" class="modal-review"></div>
<button id="edit-book" class="library-button">Edit Book ♡</button>
<button id="delete-book" class="delete-button">Remove book</button>  </div>
</div>

<script>
  const form = document.getElementById("book-form");
  const bookshelf = document.getElementById("bookshelf");

  let books = JSON.parse(localStorage.getItem("dear-darling-books") || "[]");
  let selectedBook = null;

  function saveBooks() {
    localStorage.setItem("dear-darling-books", JSON.stringify(books));
  }

  function renderBooks() {
    bookshelf.innerHTML = "";

    if (books.length === 0) {
      bookshelf.innerHTML = `
        <div class="empty-library">
          <h3>Your bookshelf is waiting ♡</h3>
          <p>Add your first book to begin your collection!</p>
        </div>`;
      return;
    }

    books.forEach((book, index) => {
      const card = document.createElement("div");
      card.className = "book-card";

      const image = document.createElement("img");
      image.src = book.cover || "https://placehold.co/300x450/E5D8C5/40533B?text=Book+Cover";
      image.alt = "Cover of " + book.title;
      image.onerror = () => {
        image.src = "https://placehold.co/300x450/E5D8C5/40533B?text=Book+Cover";
      };

      const title = document.createElement("h3");
      title.textContent = book.title;

      const author = document.createElement("p");
      author.textContent = book.author;

      const rating = document.createElement("p");
      rating.textContent = book.rating;

      card.append(image, title, author, rating);
      card.addEventListener("click", () => openBook(index));
      bookshelf.appendChild(card);
    });
  }

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const book = {
      title: document.getElementById("title").value.trim(),
      author: document.getElementById("author").value.trim(),
      cover: document.getElementById("cover").value.trim(),
      rating: document.getElementById("rating").value,
      date: document.getElementById("date").value,
      review: document.getElementById("review").value.trim()
    };

    books.unshift(book);
    saveBooks();
    renderBooks();
    form.reset();
  });

  function openBook(index) {
    selectedBook = index;
    const book = books[index];

    document.getElementById("modal-cover").src =
      book.cover || "https://placehold.co/300x450/E5D8C5/40533B?text=Book+Cover";
    document.getElementById("modal-title").textContent = book.title;
    document.getElementById("modal-author").textContent = "By " + book.author;
    document.getElementById("modal-rating").textContent = book.rating;
    document.getElementById("modal-date").textContent =
      book.date ? "Finished: " + book.date : "";
    document.getElementById("modal-review").textContent =
      book.review || "No review written yet ♡";

    document.getElementById("book-modal").style.display = "block";
  }

  function closeBook() {
    document.getElementById("book-modal").style.display = "none";
  }
document.getElementById("edit-book").addEventListener("click", function() {
  if (selectedBook === null) return;

  const book = books[selectedBook];

  const title = prompt("Edit book title:", book.title);
  if (title === null) return;

  const author = prompt("Edit author:", book.author);
  if (author === null) return;

  const cover = prompt("Edit cover image URL:", book.cover);
  if (cover === null) return;

  const rating = prompt(
    "Choose rating: ★★★★★, ★★★★☆, ★★★☆☆, ★★☆☆☆, or ★☆☆☆☆",
    book.rating
  );
  if (rating === null) return;

  const date = prompt("Edit date finished (YYYY-MM-DD):", book.date);
  if (date === null) return;

  const review = prompt("Edit your review:", book.review);
  if (review === null) return;

  book.title = title.trim() || book.title;
  book.author = author.trim() || book.author;
  book.cover = cover.trim();
  book.rating = rating;
  book.date = date;
  book.review = review;

  saveBooks();
  renderBooks();
  openBook(selectedBook);
});
  document.getElementById("delete-book").addEventListener("click", function() {
    if (selectedBook === null) return;

    if (confirm("Remove this book from your bookshelf?")) {
      books.splice(selectedBook, 1);
      saveBooks();
      renderBooks();
      closeBook();
      selectedBook = null;
    }
  });

  window.addEventListener("click", function(event) {
    if (event.target === document.getElementById("book-modal")) {
      closeBook();
    }
  });

  renderBooks();
</script>

</body>
</html>
